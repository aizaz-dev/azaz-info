    * { box-sizing: border-box; }
    html, body { height: 100%; }

    html.theme-light {
      color-scheme: light;
      --bg-0: #f7f8fb;
      --bg-1: #eef1f7;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-2: rgba(255, 255, 255, 0.94);
      --stroke: rgba(16, 18, 24, 0.12);
      --stroke-2: rgba(16, 18, 24, 0.18);
      --text: rgba(10, 12, 16, 0.92);
      --muted: rgba(10, 12, 16, 0.62);
      --shadow: 0 34px 110px rgba(16, 18, 24, 0.14);
      --shadow-2: 0 18px 60px rgba(16, 18, 24, 0.11);
      --ring: rgba(34, 211, 238, 0.18);
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(900px 560px at 10% 12%, rgba(139, 92, 246, 0.16), transparent 58%),
        radial-gradient(900px 620px at 92% 20%, rgba(34, 211, 238, 0.14), transparent 62%),
        radial-gradient(900px 660px at 52% 120%, rgba(251, 113, 133, 0.10), transparent 64%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
      min-height: 100%;
      overflow-x: hidden;

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),

      background-size: 72px 72px, 72px 72px, auto;
      opacity: 0.06;
      mix-blend-mode: overlay;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(closest-side at 22% 20%, rgba(139, 92, 246, 0.42), transparent 58%),
        radial-gradient(closest-side at 78% 22%, rgba(34, 211, 238, 0.28), transparent 54%),
        radial-gradient(closest-side at 58% 86%, rgba(251, 113, 133, 0.18), transparent 62%);
      filter: blur(44px) saturate(1.08);
      opacity: 0.34;
      transform: translate3d(0, 0, 0);
      animation: floaty 16s ease-in-out infinite alternate;
    }

    .wrap {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(34px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));

    .card {
      width: min(520px, 100%);
      position: relative;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background:
        linear-gradient(var(--surface), var(--surface)) padding-box,

      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      overflow: hidden;
      animation: enter 540ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:

    .cardTop {

      padding: 16px 16px 0;

    .theme {

      padding: 10px 12px;

    .theme:hover {

      border-color: var(--stroke-2);
      transform: translateY(-1px);

    .theme:active { transform: translateY(0); }

      box-shadow: 0 0 0 4px var(--ring);
      border-color: rgba(139, 92, 246, 0.34);

      gap: 12px;

      box-shadow: 0 10px 38px rgba(16, 18, 24, 0.10);

      background: rgba(255, 255, 255, 0.08);
      border-color: var(--stroke-2);
      transform: translateY(-1px);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);

    .icon {

    .icon svg {

    .label {

    @media (prefers-reduced-motion: reduce) {

      .card { animation: none; }
      .theme, .primary, .tile, .secondary { transition: none; }

  <script>
    (() => {
      const button = document.getElementById("themeToggle");
      const root = document.documentElement;

      const sync = () => {
        const isLight = root.classList.contains("theme-light");
        button.textContent = isLight ? "Dark" : "Light";
        button.setAttribute("aria-label", isLight ? "Toggle dark mode" : "Toggle light mode");
      };

      button.addEventListener("click", () => {
        root.classList.toggle("theme-light");
        try {
          localStorage.setItem("theme", root.classList.contains("theme-light") ? "light" : "dark");
        } catch {}
        sync();
      });

      sync();
    })();
  </script>
