<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azaz</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #0b0b0b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 20px;
      background: linear-gradient(145deg, #121212, #1a1a1a);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    p {
      opacity: 0.7;
      margin: 8px 0 24px;
    }

    a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 14px;
      background: #1f1f1f;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    a:hover {
      transform: scale(1.02);
      background: #2a2a2a;
    }
  </style>
</head>

  <div class="card">
    <h1>Azaz</h1>
